version: 1
scenarios:
  S01:
    name: long_straight
    purpose: Track a 4 m straight line between stock cylinder rows.
    start: [-2.0, -0.55, 0.0]
    goal: [2.0, -0.55, 0.0]
    timeout: 90.0
    world: stock
    expected_route_length_m: 4.0
  S02:
    name: right_angle
    purpose: A forced L corridor separates approach, 90 degree cornering and exit.
    start: [0.5, 0.0, 0.0]
    goal: [5.0, 4.5, 1.5707963267948966]
    timeout: 150.0
    world: generated
    corridor_width: 1.6
    localization_recesses: true
    route: [[0.5, 0.0], [5.0, 0.0], [5.0, 4.5]]
    expected_route_length_m: 9.0
  S03:
    name: continuous_turns
    purpose: Walls force east-north-east-south-east motion; straight shortcuts are blocked.
    start: [0.5, 0.0, 0.0]
    goal: [8.5, 0.0, 0.0]
    timeout: 240.0
    world: generated
    corridor_width: 1.6
    localization_recesses: true
    route: [[0.5, 0.0], [3.0, 0.0], [3.0, 3.0], [6.0, 3.0], [6.0, 0.0], [8.5, 0.0]]
    expected_route_length_m: 14.0
  S04:
    name: static_detour
    purpose: The start-goal straight segment crosses all three stock y=0 cylinders.
    start: [-2.0, 0.0, 0.0]
    goal: [2.0, 0.0, 0.0]
    timeout: 120.0
    world: stock
    expected_route_length_m: 4.5
  S05:
    name: narrow_passage
    purpose: Enter and traverse a 6 m long 0.8 m wide passage, then exit into a room.
    start: [-1.0, 0.0, 0.0]
    goal: [7.0, 0.0, 0.0]
    timeout: 180.0
    world: generated
    free_rectangles: [[-2.0, -1.3, 0.0, 1.3], [0.0, -0.4, 6.0, 0.4], [6.0, -1.3, 8.0, 1.3]]
    expected_route_length_m: 8.0
  S06:
    name: terminal_rotation
    purpose: Translate 3.9 m, decelerate and rotate to pi using Controller goal logic; audit recovery Spin.
    start: [-2.0, 0.55, 0.0]
    goal: [1.9, 0.55, 3.141592653589793]
    timeout: 120.0
    world: stock
    expected_route_length_m: 3.9
